# SECURE cluster (kube-context: secure), namespace dealsvc. Same image family,
# hardened by configuration. Rendered with envsubst (${IMAGE_SECURE}, ${GSA_EMAIL}).
apiVersion: v1
kind: Namespace
metadata:
  name: dealsvc
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dealsvc
  namespace: dealsvc
  annotations:
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}     # Workload Identity -> least-priv GSA
automountServiceAccountToken: false
---
# Canonical secrets live in Secret Manager (Terraform created DEMO_DB_PASSWORD /
# DEMO_ADMIN_TOKEN; the WI GSA has secretAccessor). For a zero-extra-pod demo we
# pass them via a k8s Secret; swap for the Secrets Store CSI driver in prod.
apiVersion: v1
kind: Secret
metadata: {name: dealsvc-secrets, namespace: dealsvc}
type: Opaque
stringData: {DB_PASSWORD: "pr0d-db-Pa55!", ADMIN_TOKEN: "s3cr3t-admin-token"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  replicas: 3
  selector: {matchLabels: {app: dealsvc}}
  template:
    metadata: {labels: {app: dealsvc}}
    spec:
      serviceAccountName: dealsvc
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dealsvc
          image: ${IMAGE_SECURE}
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          env:
            - {name: SECURE_DEBUG, value: "1"}
            - {name: SECURE_SSRF, value: "1"}
            - {name: SECURE_ADMIN, value: "1"}
            - {name: SECURE_RATELIMIT, value: "1"}
            - {name: EXPENSIVE_OFFLOAD, value: "1"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: dealsvc-secrets, key: DB_PASSWORD}}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: dealsvc-secrets, key: ADMIN_TOKEN}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  type: ClusterIP
  selector: {app: dealsvc}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: dealsvc}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: dealsvc}}
