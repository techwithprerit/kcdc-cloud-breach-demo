# INSECURE cluster (kube-context: insecure), namespace dealsvc. Rendered with
# envsubst (${IMAGE_INSECURE}). ClusterIP + port-forward keeps cost at zero; the
# "public LoadBalancer" point is narrated (see RUNBOOK).
apiVersion: v1
kind: Namespace
metadata:
  name: dealsvc
  # no Pod Security Admission labels -> privileged / root pods allowed
---
apiVersion: v1
kind: Secret
metadata: {name: dealsvc-secrets, namespace: dealsvc}
type: Opaque
stringData:
  DB_PASSWORD: "pr0d-db-Pa55!"
  LLM_API_KEY: "sk-DEMO-not-a-real-key"
  ADMIN_TOKEN: "s3cr3t-admin-token"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  replicas: 1
  selector: {matchLabels: {app: dealsvc}}
  template:
    metadata: {labels: {app: dealsvc}}
    spec:
      automountServiceAccountToken: true       # SA token handed to the app (pivot)
      containers:
        - name: dealsvc
          image: ${IMAGE_INSECURE}
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          # NO resource limits, NO securityContext -> root, writable FS, unbounded
          env:
            - {name: EXPENSIVE_ITERS, value: "6000000"}   # no offload -> event loop starves
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: dealsvc-secrets, key: DB_PASSWORD}}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: dealsvc-secrets, key: LLM_API_KEY}}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: dealsvc-secrets, key: ADMIN_TOKEN}}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata: {name: dealsvc, namespace: dealsvc}
spec:
  type: ClusterIP        # would be a public LoadBalancer in the real world
  selector: {app: dealsvc}
  ports: [{port: 80, targetPort: 8080}]
---
# ---- in-cluster fake metadata server: makes SSRF -> cloud-token-theft reliable
#      without touching the real metadata server (works even on this cluster) ----
apiVersion: v1
kind: ConfigMap
metadata: {name: fake-metadata-src, namespace: dealsvc}
data:
  meta.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    TOKEN = {"access_token": "ya29.FAKE-stolen-workload-token", "expires_in": 3599, "token_type": "Bearer"}
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200); self.send_header("Content-Type","application/json"); self.end_headers()
            self.wfile.write(json.dumps(TOKEN).encode())
        def log_message(self,*a): pass
    HTTPServer(("0.0.0.0",8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-metadata, namespace: dealsvc}
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-metadata}}
  template:
    metadata: {labels: {app: fake-metadata}}
    spec:
      containers:
        - name: meta
          image: ${IMAGE_INSECURE}
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/meta.py"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: src, mountPath: /scripts}]
      volumes: [{name: src, configMap: {name: fake-metadata-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: metadata, namespace: dealsvc}   # http://metadata/... from the app pod
spec:
  selector: {app: fake-metadata}
  ports: [{port: 80, targetPort: 8080}]
